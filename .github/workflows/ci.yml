name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DATABASE_URL: postgres://timekeep:timekeep@localhost:5432/timekeep
      TEST_DATABASE_URL: postgres://timekeep:timekeep@localhost:5432/timekeep_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: TimeKeep <no-reply@timekeep.local>
      MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: timekeep
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_PUBLIC_URL: http://localhost:9000/timekeep
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Postgres, Mailpit and object storage
        run: docker compose up -d --wait

      - name: Prepare storage bucket
        run: pnpm storage:init

      - name: Migrate database
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm --filter @timekeep/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Seed demo workspace
        run: pnpm db:seed

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
