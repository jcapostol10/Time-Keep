name: CI

# Every push to a branch of this repository runs CI, so a stale lockfile or a
# failing test shows up here before a Vercel build or a preview run. The
# pull_request trigger is for forks, which run without secrets; a PR from this
# repository's own branch is already covered by its push.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint · typecheck · unit · integration
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      DATABASE_URL: postgres://timekeep:timekeep@localhost:5432/timekeep
      TEST_DATABASE_URL: postgres://timekeep:timekeep@localhost:5432/timekeep_test
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # e2e signs in dozens of times from one IP; the limiter is covered by unit config, not CI.
      AUTH_RATE_LIMIT_ENABLED: "false"
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      MAIL_FROM: TimeKeep <no-reply@timekeep.local>
      MAILPIT_URL: http://localhost:8025
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: timekeep
      S3_ACCESS_KEY_ID: rustfsadmin
      S3_SECRET_ACCESS_KEY: rustfsadmin
      S3_PUBLIC_URL: http://localhost:9000/timekeep
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      # e2e runs against Vercel previews (e2e-preview.yml); Docker serves the
      # integration tests only.
      - name: Start Postgres, Mailpit and object storage
        run: docker compose up -d --wait

      - name: Prepare storage bucket
        run: pnpm storage:init

      - name: Migrate database
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: E2E coverage list matches the tests
        run: pnpm --filter @timekeep/web e2e:coverage

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test
